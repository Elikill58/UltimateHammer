plugins {
    id 'java-library'
    id 'io.github.goooler.shadow' version '8.1.7'
    id 'eclipse'
}

shadowJar {
    archiveBaseName.set('UltimateHammer')
    archiveClassifier.set(null)
    
    mergeServiceFiles()
}

eclipse {
    project {
        name = 'UltimateHammerV2'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

task prepareServer(type: Copy) {
    from shadowJar.outputs
    //rename { 'UltimateHammer.jar' }
    def pluginDir = System.getProperty('plugins.dir')
    if (pluginDir == null) {
        enabled(false)
    } else {
        into pluginDir
    }
}

build.dependsOn shadowJar

subprojects {
    apply plugin: 'java-library'

    group = 'com.elikill58'

    repositories {
        mavenCentral()
        maven {
            name 'jitpack'
            url 'https://jitpack.io/'
        }
        maven {
            name 'codemc'
            url 'https://repo.codemc.org/repository/maven-public/'
        }
		maven {
	        name 'spigotmc nexus'
		    url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
		}
	    maven {
	        name 'sonatype'
	        url 'https://oss.sonatype.org/content/repositories/snapshots/'
	    }
        maven {
            name 'eliapp'
            url 'https://repo.eliapp.fr:8081/repository/internal/'
        }
	    maven {
	    	name = 'papermc'
	    	url = 'https://papermc.io/repo/repository/maven-public/'
	    }
    }

    dependencies {
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
        compileOnly 'org.checkerframework:checker-qual:3.7.0'
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources) {
        filteringCharset = 'UTF-8'
    }
}
